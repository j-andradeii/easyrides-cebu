services:
  # ---------------------------------------------------------------------------
  # Next.js app — runs the dev server (npm run dev) with hot reload.
  # Source is bind-mounted; node_modules and .next live in named volumes so the
  # Windows host copies never leak into the Linux container.
  # ---------------------------------------------------------------------------
  app:
    image: node:20-alpine
    container_name: easyridecebu-app
    working_dir: /app
    # libc6-compat mirrors the Dockerfile's deps stage (needed by next-swc etc.)
    command: sh -c "apk add --no-cache libc6-compat && npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      # Override .env.local's DATABASE_URL: inside the compose network the app
      # reaches Postgres by the service name "db", not localhost.
      - DATABASE_URL=postgresql://easyridecebu:easyridecebu@db:5432/easyridecebu_db
      # Enable file-watching over bind mounts (Windows / WSL2 / macOS) for hot reload.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL — the easyridecebu_db database for the funnel / CRM.
  # Credentials below are for LOCAL DEV ONLY. Data persists in the pgdata volume.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: easyridecebu-db
    environment:
      - POSTGRES_USER=easyridecebu
      - POSTGRES_PASSWORD=easyridecebu
      - POSTGRES_DB=easyridecebu_db
    ports:
      # Exposed on the host so tools like drizzle-kit / psql can connect.
      # Host port is 5433, not 5432: a native Windows "postgresql-x64-17" service
      # already owns 5432, and it would silently shadow this container.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyridecebu -d easyridecebu_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
  pgdata:
