name: Vercel Production Deployment

on:
  pull_request:
    types: [closed]
    branches:
      - main
  # Lets you re-run migrations + deploy by hand from the Actions tab.
  workflow_dispatch:


env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# Never let two production deploys (or two migration runs) overlap.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Typecheck
    # A PR that is closed WITHOUT being merged must not deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  # Applies drizzle/*.sql to Supabase BEFORE the new code goes live, so the
  # deployed app never queries a schema that doesn't exist yet.
  #
  # Requires one secret: DATABASE_URL, on the "production" environment
  # (repo Settings > Environments > production > Environment secrets). It must be
  # the SESSION-mode Supavisor pooler URL:
  #
  #   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
  #
  # Three details that are easy to get wrong, all enforced by the check below:
  #   - Not db.<project-ref>.supabase.co. That host has an AAAA record and no A
  #     record; GitHub runners are IPv4-only, so it dies with ENOTFOUND.
  #   - Port 5432 (session), not 6543 (transaction). 6543 is the runtime URL for
  #     Vercel; migrations want a real session for DDL.
  #   - The user is `postgres.<project-ref>`, not plain `postgres`.
  migrate:
    name: Migrate Supabase Postgres
    needs: test
    runs-on: ubuntu-latest
    # Optional: attach repo Settings > Environments > production for approval gates.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails in two seconds with a readable message instead of burning a
      # connect_timeout on a host that can never resolve. Never echoes the URL.
      - name: Validate DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set on the 'production' environment."
            exit 1
          fi
          case "$DATABASE_URL" in
            *@db.*.supabase.co:*)
              echo "::error::DATABASE_URL uses the direct host db.<ref>.supabase.co, which is IPv6-only. GitHub runners are IPv4-only. Use the session-mode pooler: aws-0-<region>.pooler.supabase.com:5432 with user postgres.<ref>."
              exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *:6543/*)
              echo "::error::Port 6543 is the transaction pooler — that URL belongs in Vercel's runtime env, not here. Migrations need session mode on port 5432."
              exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *sslmode=require*) ;;
            *)
              echo "::error::DATABASE_URL is missing ?sslmode=require. Supabase rejects unencrypted connections and the Postgres driver leaves SSL off unless the URL asks for it."
              exit 1 ;;
          esac
          echo "DATABASE_URL is a session-mode Supabase pooler URL."

      # The check above only inspects the URL's shape. This one actually opens a
      # connection, because the failure that matters most — a password rotated in
      # Supabase without updating this secret — produces a perfectly well-formed
      # URL. drizzle-kit reports that case as a spinner followed by `exit 1` with
      # no message, so without this step the log says nothing at all.
      - name: Verify database credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > dbcheck.cjs <<'NODE'
          const postgres = require('postgres');
          const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 10 });

          const HINTS = {
            '28P01': 'The password in the DATABASE_URL secret is wrong. It was most likely rotated in Supabase (Settings > Database > Reset database password) without updating this secret.',
            '28000': 'Auth rejected. On the pooler the user must be postgres.<project-ref>, not plain postgres.',
            ENOTFOUND: 'Host did not resolve. Free-tier direct connections (db.<ref>.supabase.co) publish only an AAAA record and GitHub runners have no IPv6 — use the pooler host.',
            ETIMEDOUT: 'Connection timed out. A free-tier project pauses after 7 days idle; open the Supabase dashboard to wake it, then re-run.',
            CONNECT_TIMEOUT: 'Connection timed out. A free-tier project pauses after 7 days idle; open the Supabase dashboard to wake it, then re-run.',
          };

          sql`select current_user as u`
            .then(async ([row]) => {
              console.log(`Connected to Postgres as "${row.u}".`);
              await sql.end();
            })
            .catch(async (error) => {
              const code = error.code || error.name;
              const hint = HINTS[code] ? ` ${HINTS[code]}` : '';
              // Never print the URL itself — it carries the password.
              console.log(`::error::Cannot connect to the database (${code}): ${error.message}.${hint}`);
              await sql.end().catch(() => {});
              process.exit(1);
            });
          NODE
          node dbcheck.cjs

      # drizzle.config.ts reads process.env.DATABASE_URL. It also calls
      # dotenv on .env.local, which is absent in CI — dotenv never overrides
      # an already-set env var, so the secret below is what gets used.
      #
      # drizzle-kit migrate is idempotent: it reads the __drizzle_migrations
      # table and applies only entries from drizzle/meta/_journal.json that
      # aren't recorded yet, so re-running a deploy is safe.
      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      # Brings the funnel definition (pipeline, stages, workflows W1-W5) in line
      # with the code that is about to deploy. Runs after migrate because it
      # writes to tables the migrations create.
      #
      # Idempotent by construction: every write is an upsert, and a retired stage
      # is only dropped once nothing points at it — so a re-run of this workflow
      # never duplicates rows or touches live opportunities. is_active on a
      # workflow is left alone, so a workflow switched off in the portal stays off.
      - name: Seed funnel definition
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed

      # Fills the public catalogues on a FRESH database, so a first deploy comes
      # up with tours and a fleet instead of two empty sections.
      #
      # --only-if-empty is what makes this safe to leave in the pipeline forever:
      # each script does nothing at all once its table has rows. Without it the
      # scripts match on slug / vehicle class, and a tour RENAMED in the portal
      # makes the repo's original slug look missing — so every subsequent deploy
      # would re-insert it and leave two copies of one tour on the site.
      #
      # Never add --force here. That would overwrite the live catalogue with the
      # repo's seed data on every deploy, reverting whatever an editor changed.
      - name: Seed tour catalogue (fresh database only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run import-tours -- --only-if-empty

      - name: Seed vehicle fleet (fresh database only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run import-vehicles -- --only-if-empty

      # Bootstraps the owner account so a fresh database is never left without a
      # way in — there is no public signup (plan §9.1).
      #
      # --if-missing is load-bearing: without it this step would re-hash the
      # ADMIN_PASSWORD secret into the row on EVERY deploy, silently reverting a
      # password changed in the portal. With it, an existing account is untouched,
      # so rotating the password is a portal action and this step stays a no-op.
      #
      # The password comes from a secret rather than the script's generator on
      # purpose: a generated one is printed to stdout, and step output lands in
      # the Actions log where anyone with repo read access can retrieve it.
      # Requires ADMIN_PASSWORD on the "production" environment.
      - name: Ensure admin account
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::ADMIN_PASSWORD secret is not set on the 'production' environment."
            exit 1
          fi
          npm run create-admin -- \
            --email joseph_andrade@outlook.ph \
            --name "Joseph Andrade" \
            --role owner \
            --if-missing \
            --password "$ADMIN_PASSWORD"

  # No DATABASE_URL here on purpose: `vercel pull` downloads the project's own
  # production env vars, and the running app reads DATABASE_URL from Vercel at
  # request time. That one should be the TRANSACTION pooler (port 6543) — Vercel
  # functions scale out and would exhaust session slots on 5432. src/db/client.ts
  # already sets `prepare: false`, which is what transaction mode requires.
  #
  # `needs: migrate` is what keeps the ordering safe: a failed migration blocks
  # the deploy, so old code keeps serving rather than new code hitting an old schema.
  deploy:
    name: Deploy to Vercel
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
